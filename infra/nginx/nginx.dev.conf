# Point d'entrée unique. En développement : HTTP seulement. En production : HTTPS avec le certificat interne (étape 5.7).
events {}
http {
  server_tokens off;
  upstream api { server api:3000; }
  upstream idp { server keycloak:8080; }
  server {
    listen 8080;
    # Les métriques ne sortent jamais par le point d'entrée public.
    location = /metrics { return 404; }
    location /api/ { proxy_pass http://api; proxy_set_header X-Request-Id $request_id; client_max_body_size 12m; }
    location = /health { proxy_pass http://api; }
    location /auth/ { proxy_pass http://idp/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
